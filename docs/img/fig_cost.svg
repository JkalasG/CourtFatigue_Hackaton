<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The cold start costs more than twice what back-to-backs do"><rect width="820" height="300" rx="10" fill="#1d1915"/><text x="28.0" y="40.0" font-size="20" fill="#efe6d8" text-anchor="start" font-weight="700">The cold start costs more than twice what back-to-backs do</text><text x="28.0" y="64.0" font-size="13" fill="#a89c8a" text-anchor="start" font-weight="400">Points per team per season (95% CI). Cold start ≈ 0.9 wins at ~30 points per win.</text><line x1="340.0" x2="340.0" y1="92" y2="232" stroke="#efe6d8"/><text x="340.0" y="250.0" font-size="12" fill="#a89c8a" text-anchor="middle" font-weight="400">0</text><line x1="445.0" x2="445.0" y1="92" y2="232" stroke="#3a332c" stroke-dasharray="2 4"/><text x="445.0" y="250.0" font-size="12" fill="#a89c8a" text-anchor="middle" font-weight="400">−10</text><line x1="550.0" x2="550.0" y1="92" y2="232" stroke="#3a332c" stroke-dasharray="2 4"/><text x="550.0" y="250.0" font-size="12" fill="#a89c8a" text-anchor="middle" font-weight="400">−20</text><line x1="655.0" x2="655.0" y1="92" y2="232" stroke="#3a332c" stroke-dasharray="2 4"/><text x="655.0" y="250.0" font-size="12" fill="#a89c8a" text-anchor="middle" font-weight="400">−30</text><line x1="760.0" x2="760.0" y1="92" y2="232" stroke="#3a332c" stroke-dasharray="2 4"/><text x="760.0" y="250.0" font-size="12" fill="#a89c8a" text-anchor="middle" font-weight="400">−40</text><text x="28.0" y="126.0" font-size="13" fill="#efe6d8" text-anchor="start" font-weight="400">Cold start (first 2 min after checking in)</text><rect x="340" y="112" width="287.7" height="20" rx="3" fill="#d9772e"/><line x1="536.5" x2="722.3" y1="122" y2="122" stroke="#efe6d8" stroke-width="1.5"/><text x="730.3" y="127.0" font-size="13" fill="#efe6d8" text-anchor="start" font-weight="700">−27 pts</text><text x="28.0" y="186.0" font-size="13" fill="#efe6d8" text-anchor="start" font-weight="400">Back-to-backs (2nd game in 2 days)</text><rect x="340" y="172" width="121.4" height="20" rx="3" fill="#4a8fd0"/><line x1="373.1" x2="549.6" y1="182" y2="182" stroke="#efe6d8" stroke-width="1.5"/><text x="557.6" y="187.0" font-size="13" fill="#efe6d8" text-anchor="start" font-weight="700">−12 pts</text><text x="28.0" y="282.0" font-size="11" fill="#a89c8a" text-anchor="start" font-weight="400">Full cost vs. the player's own level, not what a coach can recover · source: web/data/extra.json</text></svg>