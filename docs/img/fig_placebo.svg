<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A popular coaching rule is noise"><rect width="820" height="320" rx="10" fill="#1d1915"/><text x="28.0" y="40.0" font-size="20" fill="#efe6d8" text-anchor="start" font-weight="700">A popular coaching rule is noise</text><text x="28.0" y="64.0" font-size="13" fill="#a89c8a" text-anchor="start" font-weight="400">Share of players flagged as “gets tired” (564 players). If a rule flags as many with random minutes, it is not seeing fatigue.</text><rect x="330" y="82" width="10" height="10" rx="2" fill="#4a8fd0"/><text x="346.0" y="92.0" font-size="12" fill="#efe6d8" text-anchor="start" font-weight="400">real minutes</text><rect x="460" y="82" width="10" height="10" rx="2" fill="#d9772e"/><text x="476.0" y="92.0" font-size="12" fill="#efe6d8" text-anchor="start" font-weight="400">minutes shuffled within player (fatigue impossible)</text><text x="28.0" y="146.0" font-size="13" fill="#efe6d8" text-anchor="start" font-weight="400">Naive rule: “sub them if they drop 3 pts”</text><rect x="330" y="130" width="247.9" height="16" rx="3" fill="#4a8fd0"/><text x="585.9" y="143.0" font-size="12" fill="#efe6d8" text-anchor="start" font-weight="400">60.5% flagged</text><rect x="330" y="150" width="243.5" height="16" rx="3" fill="#d9772e"/><text x="581.5" y="163.0" font-size="12" fill="#efe6d8" text-anchor="start" font-weight="400">59.4% flagged</text><text x="28.0" y="226.0" font-size="13" fill="#efe6d8" text-anchor="start" font-weight="400">CourtFatigue: 95% CI + Benjamini-Hochberg</text><rect x="330" y="210" width="2.0" height="16" rx="3" fill="#4a8fd0"/><text x="340.0" y="223.0" font-size="12" fill="#efe6d8" text-anchor="start" font-weight="400">0.0% flagged</text><rect x="330" y="230" width="2.0" height="16" rx="3" fill="#d9772e"/><text x="340.0" y="243.0" font-size="12" fill="#efe6d8" text-anchor="start" font-weight="400">0.04% flagged</text><text x="28.0" y="302.0" font-size="11" fill="#a89c8a" text-anchor="start" font-weight="400">Placebo with 20 permutations · source: web/data/summary.json</text></svg>